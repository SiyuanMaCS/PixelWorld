<title>PixelWorld · __ID__</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#101419;color:#eef3f7;font:14px system-ui,sans-serif}canvas{display:block;width:min(100%,768px);height:auto;image-rendering:pixelated;background:#080a0c;border-radius:8px;margin:auto}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:768px;margin:14px auto 0}button{background:#a5ef83;border:0;border-radius:7px;color:#142110;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}input[type=range]{flex:1;min-width:100px}.caption{max-width:768px;margin:12px auto;color:#a7b0be;font-size:12px;line-height:1.5}</style>
<canvas id="canvas" width="256" height="144"></canvas><div class="controls"><button id="play">Play</button><button id="replay">Replay</button><input id="seek" type="range" min="0" max="19" value="0"><output id="time"></output><label><input id="loop" type="checkbox" checked> Loop</label></div><div id="caption" class="caption"></div>
<script>'use strict';const DATA=__DATA__;function unpack(s){const t=atob(s),b=new Uint8Array(t.length);for(let i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return new Uint32Array(b.buffer)}const frames=[unpack(DATA.first)];for(const encoded of DATA.deltas){const f=new Uint32Array(frames.at(-1)),p=unpack(encoded);for(let i=0;i<p.length;){const start=p[i++],count=p[i++];f.set(p.subarray(i,i+count),start);i+=count}frames.push(f)}const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),img=ctx.createImageData(256,144);let frame=0,playing=false,timer=null;function draw(n){frame=Math.max(0,Math.min(19,n));const pixels=frames[frame];for(let i=0;i<pixels.length;i++){const v=pixels[i],p=i*4;img.data[p]=v>>>16;img.data[p+1]=(v>>>8)&255;img.data[p+2]=v&255;img.data[p+3]=255}ctx.putImageData(img,0,0);seek.value=frame;time.textContent=`${frame}/19 · ${(frame/4).toFixed(2)}s`}function pause(){playing=false;clearInterval(timer);timer=null;play.textContent='Play'}function start(){if(playing)return;if(frame===19)draw(0);playing=true;play.textContent='Pause';timer=setInterval(()=>{if(frame<19)draw(frame+1);else if(loop.checked)draw(0);else pause()},250)}play.onclick=()=>playing?pause():start();replay.onclick=()=>{pause();draw(0);start()};seek.oninput=e=>{pause();draw(+e.target.value)};caption.textContent=DATA.caption;draw(0);window.__pixelReady=true;</script></html>
